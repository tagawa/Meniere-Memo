<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1557b0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MeniereMemo">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/app.css">
  <title>MeniereMemo</title>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1 class="app-title" data-i18n="appName">MeniereMemo</h1>
      <button id="lang-toggle" class="lang-toggle" aria-label="Switch language">日本語</button>
    </header>

    <main id="views">
      <section id="view-home" class="view active" aria-label="Home"></section>
      <section id="view-history" class="view" aria-label="History" hidden></section>
      <section id="view-doctor" class="view" aria-label="Doctor Summary" hidden></section>
    </main>

    <nav class="tab-bar" aria-label="Main navigation">
      <button class="tab active" data-view="home" aria-current="page">
        <span aria-hidden="true">🏠</span>
        <span data-i18n="nav.home">Home</span>
      </button>
      <button class="tab" data-view="history">
        <span aria-hidden="true">📋</span>
        <span data-i18n="nav.history">History</span>
      </button>
      <button class="tab" data-view="doctor">
        <span aria-hidden="true">🏥</span>
        <span data-i18n="nav.doctor">Doctor</span>
      </button>
    </nav>
  </div>

  <!-- Log Episode Modal -->
  <div id="log-modal" class="modal" role="dialog" aria-modal="true"
       aria-labelledby="log-modal-title" hidden>
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-sheet" id="modal-sheet">
      <div class="modal-handle" aria-hidden="true"></div>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- Screen reader announcements -->
  <div id="status-msg" role="status" aria-live="polite" aria-atomic="true"
       style="position:absolute; left:-9999px; top:auto; width:1px; height:1px; overflow:hidden;"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
