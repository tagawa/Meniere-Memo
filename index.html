<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1557b0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ménière Memo">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/app.css">
  <title>Ménière Memo</title>
  
  <!-- Fathom - only loads on production; assumption: deployed to apex domain only -->
  <script>
    if (location.hostname === 'menierememo.com') {
      var s = document.createElement('script');
      s.src = 'https://cdn.usefathom.com/script.js';
      s.setAttribute('data-site', 'PXETEITW');
      s.defer = true;
      document.head.appendChild(s);
    }
  </script>
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1 class="app-title" data-i18n="appName">Ménière Memo</h1>
      <button id="lang-toggle" class="lang-toggle" aria-label="Switch language">日本語</button>
    </header>

    <main id="views">
      <section id="view-home" class="view active" aria-label="Home" tabindex="-1"></section>
      <section id="view-history" class="view" aria-label="History" hidden tabindex="-1"></section>
      <section id="view-doctor" class="view" aria-label="Doctor Summary" hidden tabindex="-1"></section>
    </main>

    <div id="pressure-strip" class="pressure-strip" hidden></div>

    <nav class="tab-bar" aria-label="Main navigation">
      <a class="tab active" data-view="home" href="#home" aria-current="page">
        <span aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
        <span data-i18n="nav.home">Home</span>
      </a>
      <a class="tab" data-view="history" href="#history">
        <span aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 14v2.2l1.6 1"/><path d="M16 2v4"/><path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5"/><path d="M3 10h5"/><path d="M8 2v4"/><circle cx="16" cy="16" r="6"/></svg></span>
        <span data-i18n="nav.history">History</span>
      </a>
      <a class="tab" data-view="doctor" href="#doctor">
        <span aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2v2"/><path d="M5 2v2"/><path d="M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1"/><path d="M8 15a6 6 0 0 0 12 0v-3"/><circle cx="20" cy="10" r="2"/></svg></span>
        <span data-i18n="nav.doctor">Doctor</span>
      </a>
    </nav>
  </div>

  <!-- Log Episode Modal -->
  <div id="log-modal" class="modal" role="dialog" aria-modal="true"
       aria-labelledby="log-modal-title" hidden>
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-sheet" id="modal-sheet" tabindex="-1">
      <div class="modal-handle" aria-hidden="true"></div>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- Screen reader announcements -->
  <div id="status-msg" role="status" aria-live="polite" aria-atomic="true"
       style="position:absolute; left:-9999px; top:auto; width:1px; height:1px; overflow:hidden;"></div>
  <!-- Assertive region for error announcements (write failures). role="alert" and aria-live="assertive"
       are redundant but kept for cross-AT reliability. -->
  <div id="alert-msg" role="alert" aria-live="assertive" aria-atomic="true"
       style="position:absolute; left:-9999px; top:auto; width:1px; height:1px; overflow:hidden;"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
